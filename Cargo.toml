[package]
name = "bootmux"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Manage tmux sessions and Herdr workspaces from tmuxinator-compatible YAML"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/griffinqiu/bootmux"
repository = "https://github.com/griffinqiu/bootmux"
keywords = ["tmux", "herdr", "tmuxinator", "terminal", "workspace"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
shell-words = "1"
terminal_size = "0.4"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
