[package]
name = "bootmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Manage tmux sessions and Herdr workspaces from tmuxinator-compatible YAML"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
shell-words = "1"
terminal_size = "0.4"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
